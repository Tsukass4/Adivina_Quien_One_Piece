<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Adivina Quién - One Piece</title>

<style>
body {
    font-family: Arial;
    text-align: center;
    color: white;
    padding: 20px;

    background-image: url('img/fondo_pirata.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    background-color: black;
}

/* Oscurecer fondo */
body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.4);
    z-index: -1;
}

/* CONTENEDOR PRINCIPAL */
.game-container {
    max-width: 1200px;
    margin: auto;
    position: relative;
}

/* TÍTULO CENTRADO EN MAPA */
h1 {
    position: absolute;
    top: 30px;
    left: 50%;
    transform: translateX(-50%);
    text-shadow: 2px 2px 5px black;
    z-index: 2;
}

/* UI SUPERIOR */
.top-ui {
    position: absolute;
    top: 100px;
    left: 50%;
    transform: translateX(-50%);

    width: 90%;          /* 👈 clave */
    max-width: 1000px;   /* 👈 limita al mapa */

    display: flex;
    justify-content: space-between;
}

/* BOTÓN FULLSCREEN */
#btnFull {
    background: linear-gradient(45deg, #ffcc00, #ff7b00);
    color: black;
    border: none;
    padding: 8px 15px;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
    transition: 0.2s;
}

#btnFull:hover {
    transform: scale(1.1);
}

/* PROGRESO */
#progreso {
    background: rgba(0,0,0,0.5);
    padding: 5px 15px;
    border-radius: 10px;
    font-weight: bold;
}

/* CARD */
.card {
    position: relative;
    z-index: 1;

    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);

    border: 1px solid rgba(255,255,255,0.2);

    padding: 30px;
    border-radius: 15px;
    max-width: 500px;
    margin: auto;
    margin-top: 180px;
}

/* BOTONES */
button {
    margin: 10px;
    padding: 10px 20px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    font-weight: bold;
    transition: 0.2s;
}

button:hover {
    transform: scale(1.1);
}

.si {
    background: linear-gradient(45deg, #00c853, #64dd17);
}

.no {
    background: linear-gradient(45deg, #d50000, #ff1744);
}
</style>
</head>

<body>

<div class="game-container">

<h1>🏴‍☠️ Adivina Quién - One Piece</h1>

<div class="top-ui">
    <button id="btnFull" onclick="toggleFullScreen()">🖥️ Pantalla completa</button>
    <div id="progreso">Pregunta 1 / 6</div>
</div>

<div class="card">

    <h2 id="pregunta"></h2>

    <div id="botones">
        <button class="si" onclick="responder(true)">Sí</button>
        <button class="no" onclick="responder(false)">No</button>
    </div>

    <div id="resultado"></div>

</div>

</div>

<script>
let atributos = ["fruta","capitan","espada","marina","haki","humano"];

let preguntas = {
    fruta: "¿Tiene fruta del diablo?",
    capitan: "¿Es capitán?",
    espada: "¿Usa espada?",
    marina: "¿Es de la marina?",
    haki: "¿Usa haki?",
    humano: "¿Es humano?"
};

let respuestas = {};
let indice = 0;

let base = JSON.parse(localStorage.getItem("base")) || {
    "110011": { nombre: "Luffy", imagen: "img/luffy.png" }
};

/* FULLSCREEN */
function toggleFullScreen() {
    let btn = document.getElementById("btnFull");

    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
        btn.innerText = "❌ Salir";
    } else {
        document.exitFullscreen();
        btn.innerText = "🖥️ Pantalla completa";
    }
}

/* FIX ESC */
document.addEventListener("fullscreenchange", () => {
    let btn = document.getElementById("btnFull");

    if (!document.fullscreenElement) {
        btn.innerText = "🖥️ Pantalla completa";
    } else {
        btn.innerText = "❌ Salir";
    }
});

/* PROGRESO */
function actualizarProgreso() {
    let total = atributos.length;
    let actual = indice + 1;

    if(indice >= total){
        document.getElementById("progreso").innerText = "Resultado";
    } else {
        document.getElementById("progreso").innerText = `Pregunta ${actual} / ${total}`;
    }
}

function mostrarPregunta(){
    actualizarProgreso();

    if(indice < atributos.length){
        document.getElementById("pregunta").innerText = preguntas[atributos[indice]];
    } else {
        procesar();
    }
}

function responder(valor){
    respuestas[atributos[indice]] = valor;
    indice++;
    mostrarPregunta();
}

function generarClave(){
    return atributos.map(a => respuestas[a] ? "1" : "0").join("");
}

function procesar(){
    let clave = generarClave();
    document.getElementById("botones").style.display = "none";

    if(base[clave]){
        let personaje = base[clave];

        document.getElementById("resultado").innerHTML = `
            <h2>🎯 ¿Es ${personaje.nombre}?</h2>
            <img src="${personaje.imagen}" width="200">
            <br><br>
            <button onclick="confirmar(true)">Sí, correcto</button>
            <button onclick="confirmar(false)">No</button>
        `;
    } else {
        aprenderNuevo();
    }
}

function confirmar(correcto){
    if(correcto){
        document.getElementById("resultado").innerHTML = `
            <p>😎 ¡Lo sabía!</p>
            <br>
            <button onclick="reiniciar()">🔄 Jugar de nuevo</button>
        `;
    } else {
        aprenderNuevo();
    }
}

function aprenderNuevo(){
    let nombre = prompt("¿Qué personaje era?");
    if(!nombre) return;

    let clave = generarClave();

    base[clave] = {
        nombre: nombre,
        imagen: "img/default.png"
    };

    localStorage.setItem("base", JSON.stringify(base));

    alert("✅ Aprendido!");
    reiniciar();
}

function reiniciar(){
    respuestas = {};
    indice = 0;

    document.getElementById("botones").style.display = "block";
    document.getElementById("resultado").innerHTML = "";

    actualizarProgreso();
    mostrarPregunta();
}

mostrarPregunta();
</script>

</body>
</html>
